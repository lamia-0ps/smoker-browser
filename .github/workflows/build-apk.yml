name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate cigarette launcher icons
        run: |
          pip install --quiet pillow
          python scripts/make_icon.py

      - name: Ensure MainBinding import
        run: |
          python3 - <<'PY'
          p = "app/src/main/java/com/smoke/browser/MainActivity.java"
          s = open(p, encoding="utf-8", errors="ignore").read()
          needle = "import com.smoke.browser.databinding.MainBinding;"
          if needle not in s:
              s = s.replace(
                  "package com.smoke.browser;",
                  "package com.smoke.browser;\n\n" + needle,
                  1,
              )
              open(p, "w", encoding="utf-8", newline="").write(s)
              print("added MainBinding import")
          else:
              print("MainBinding import already present")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK and icons
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SmokerBrowser.apk
          cp dist/SmokerBrowser.apk SmokerBrowser.apk
          ls -lh SmokerBrowser.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SmokerBrowser.apk dist/SmokerBrowser.apk scripts/make_icon.py \
            app/src/main/res/mipmap-* app/src/main/res/drawable \
            app/src/main/java/com/smoke/browser/MainActivity.java \
            fastlane/metadata/android/en-US/images/icon.png || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Add cigarette icon and SmokerBrowser.apk [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SmokerBrowser
          path: SmokerBrowser.apk
