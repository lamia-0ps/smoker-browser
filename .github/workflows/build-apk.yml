name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate cigarette launcher icons
        run: |
          pip install --quiet pillow
          python scripts/make_icon.py

      - name: Ensure MainBinding import
        run: |
          python3 - <<'PY'
          p = "app/src/main/java/com/smoke/browser/MainActivity.java"
          s = open(p, encoding="utf-8", errors="ignore").read()
          needle = "import com.smoke.browser.databinding.MainBinding;"
          if needle not in s:
              s = s.replace(
                  "package com.smoke.browser;",
                  "package com.smoke.browser;\n\n" + needle,
                  1,
              )
              open(p, "w", encoding="utf-8", newline="").write(s)
              print("added MainBinding import")
          else:
              print("MainBinding import already present")
          PY

      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          ls -la "$ANDROID_SDK_ROOT" || true
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log

      - name: Keep Gradle log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -n 200 gradle-build.log || true
          git add gradle-build.log || true
          git commit -m "CI: gradle build log [skip ci]" || true
          git push || true

      - name: Publish APK and icons
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SmokerBrowser.apk
          cp dist/SmokerBrowser.apk SmokerBrowser.apk
          ls -lh SmokerBrowser.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SmokerBrowser.apk dist/SmokerBrowser.apk \
            app/src/main/res/mipmap-* \
            app/src/main/java/com/smoke/browser/MainActivity.java \
            fastlane/metadata/android/en-US/images/icon.png || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Add cigarette icon and SmokerBrowser.apk [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SmokerBrowser
          path: SmokerBrowser.apk
